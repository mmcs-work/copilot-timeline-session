<!doctype html>
<html><head><style>
  body { background:var(--vscode-editor-background); color:var(--vscode-foreground); font-family:var(--vscode-font-family); font-size:12px; margin:0; }
  main { margin:0 auto; max-width:1180px; padding:22px 26px 32px; }
  .header { align-items:flex-start; display:flex; gap:18px; justify-content:space-between; margin-bottom:18px; }.title-row { align-items:center; display:flex; gap:9px; }.pulse { background:var(--vscode-testing-iconPassed); border-radius:50%; box-shadow:0 0 0 4px color-mix(in srgb,var(--vscode-testing-iconPassed) 18%,transparent); height:8px; width:8px; } h1 { font-size:16px; font-weight:650; letter-spacing:.1px; margin:0; }.subtitle,.hint,.time { color:var(--vscode-descriptionForeground); }.subtitle { margin:5px 0 0 17px; }
  .stats { display:flex; gap:7px; }.stat { background:var(--vscode-editorWidget-background); border:1px solid var(--vscode-widget-border); border-radius:5px; min-width:68px; padding:7px 9px; }.stat strong { display:block; font-size:14px; font-weight:650; }.stat span { color:var(--vscode-descriptionForeground); font-size:10px; text-transform:uppercase; }
  .note { align-items:flex-end; background:var(--vscode-editorWidget-background); border:1px solid var(--vscode-widget-border); border-radius:7px; display:flex; gap:8px; margin:0 0 14px; padding:9px 10px; }.note div { flex:1; }.note label { color:var(--vscode-descriptionForeground); display:block; font-size:10px; font-weight:650; letter-spacing:.4px; margin-bottom:5px; text-transform:uppercase; }.note textarea { background:var(--vscode-input-background); border:1px solid var(--vscode-input-border); border-radius:3px; box-sizing:border-box; color:var(--vscode-input-foreground); font-family:inherit; font-size:12px; height:42px; padding:6px 7px; resize:vertical; width:100%; }
  .table-wrap { border:1px solid var(--vscode-widget-border); border-radius:7px; box-shadow:0 7px 22px rgba(0,0,0,.12); overflow:auto; }table { border-collapse:collapse; min-width:820px; width:100%; }th { background:var(--vscode-editorGroupHeader-tabsBackground); color:var(--vscode-descriptionForeground); font-size:10px; font-weight:650; letter-spacing:.4px; padding:8px 10px; position:sticky; text-align:left; text-transform:uppercase; top:0; z-index:1; }td { border-top:1px solid var(--vscode-widget-border); padding:9px 10px; vertical-align:middle; }.commit-row { cursor:pointer; transition:background .12s ease; }.commit-row:hover,.commit-row.is-open { background:var(--vscode-list-hoverBackground); }
  .graph { position:relative; text-align:center; width:26px; }.graph::before { background:var(--vscode-textLink-foreground); bottom:-18px; content:""; left:50%; opacity:.55; position:absolute; top:-18px; transform:translateX(-50%); width:2px; }.node { background:var(--vscode-editor-background); border:3px solid var(--vscode-textLink-foreground); border-radius:50%; display:inline-block; height:8px; position:relative; width:8px; z-index:1; }tbody:first-of-type .graph::before { top:50%; }tbody:last-of-type .graph::before { bottom:50%; }.subject { font-size:12px; font-weight:650; }.hint { font-size:10px; margin-top:3px; }.star { background:transparent; border:0; color:var(--vscode-descriptionForeground); cursor:pointer; font-size:15px; margin-right:4px; padding:0 2px; vertical-align:-1px; }.star.important { color:var(--vscode-editorWarning-foreground); }.added { color:var(--vscode-testing-iconPassed); }.deleted { color:var(--vscode-testing-iconFailed); }
  .files { display:flex; flex-wrap:wrap; gap:4px; max-width:360px; }.file { background:var(--vscode-textBlockQuote-background); border:1px solid var(--vscode-widget-border); border-radius:3px; color:var(--vscode-descriptionForeground); font-family:var(--vscode-editor-font-family); font-size:10px; padding:2px 5px; }.time,.hash { font-family:var(--vscode-editor-font-family); font-size:10px; white-space:nowrap; }.hash { color:var(--vscode-textLink-foreground); }.prompt { text-align:center; width:34px; }.prompt-icon { background:transparent; border:1px solid transparent; border-radius:4px; color:var(--vscode-textLink-foreground); cursor:pointer; font-size:14px; padding:2px 5px; }.prompt-icon:hover { background:var(--vscode-toolbar-hoverBackground); border-color:var(--vscode-widget-border); }.response-icon { color:var(--vscode-testing-iconPassed); }.model { color:var(--vscode-descriptionForeground); display:block; font-size:9px; margin-top:2px; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }.not-captured { color:var(--vscode-disabledForeground); }
  .prompt-popover { background:var(--vscode-editorWidget-background); border:1px solid var(--vscode-widget-border); border-radius:6px; box-shadow:0 12px 30px rgba(0,0,0,.35); display:none; max-width:440px; padding:12px; position:fixed; width:340px; z-index:10; }.prompt-popover.visible { display:block; }.prompt-heading { color:var(--vscode-descriptionForeground); font-size:10px; font-weight:650; letter-spacing:.4px; text-transform:uppercase; }.prompt-text { font-size:12px; line-height:18px; margin-top:8px; max-height:220px; overflow:auto; white-space:pre-wrap; }.close-prompt { background:transparent; color:var(--vscode-descriptionForeground); float:right; font-size:15px; padding:0 2px; }
  .diff-row[hidden] { display:none; }.diff-cell { background:var(--vscode-textCodeBlock-background); padding:0; }.diff-label { align-items:center; color:var(--vscode-descriptionForeground); display:flex; font-size:10px; gap:6px; letter-spacing:.35px; padding:8px 10px; text-transform:uppercase; }.diff-label::before { background:var(--vscode-textLink-foreground); border-radius:50%; content:""; height:5px; width:5px; }.diff { border-top:1px solid var(--vscode-widget-border); box-sizing:border-box; font-family:var(--vscode-editor-font-family); font-size:12px; line-height:19px; max-height:350px; overflow:auto; white-space:pre; }.line { display:block; min-height:19px; padding:0 12px; }.addition { background:var(--vscode-diffEditor-insertedLineBackground); }.deletion { background:var(--vscode-diffEditor-removedLineBackground); }.hunk { background:var(--vscode-textBlockQuote-background); color:var(--vscode-textLink-foreground); }.meta { color:var(--vscode-descriptionForeground); }
  .actions { align-items:center; border-top:1px solid var(--vscode-widget-border); display:flex; gap:8px; margin-top:16px; padding-top:16px; }button { background:var(--vscode-button-background); border:0; border-radius:4px; color:var(--vscode-button-foreground); cursor:pointer; font-family:inherit; font-size:12px; font-weight:600; padding:7px 11px; }button:hover { background:var(--vscode-button-hoverBackground); }.secondary { background:var(--vscode-button-secondaryBackground); color:var(--vscode-button-secondaryForeground); }.danger { background:transparent; color:var(--vscode-errorForeground); margin-left:auto; }.danger:hover { background:var(--vscode-inputValidation-errorBackground); }
</style></head><body><main>
  <div class="header"><div><div class="title-row"><span class="pulse"></span><h1>Copilot Timeline Session</h1></div><p class="subtitle">Review each checkpoint, inspect its diff, then keep or discard the session.</p></div><div class="stats">{{STATS}}</div></div>
  <div class="note"><div><label for="sessionNote">Session note</label><textarea id="sessionNote" maxlength="1000" placeholder="Optional note saved in the final Copilot session commit.">{{SESSION_NOTE}}</textarea></div><button onclick="saveNote()">Save note</button></div>
  <div class="table-wrap"><table><thead><tr><th>Graph</th><th>Checkpoint</th><th>Changed files</th><th>Date / time</th><th>Commit</th><th>Prompt</th><th>Response</th></tr></thead>{{ROWS}}</table></div>
  <div class="actions"><button onclick="postMessage({action:'keep'})">Keep all changes</button><button class="secondary" onclick="postMessage({action:'compare'})">Open full comparison</button><button class="danger" onclick="postMessage({action:'discard'})">Discard session</button></div>
  <div class="prompt-popover" id="promptPopover" onmouseenter="keepPromptOpen()" onmouseleave="hidePrompt()"><button class="close-prompt" onclick="closePrompt()">×</button><div class="prompt-heading" id="detailTitle">Original Copilot prompt</div><div class="prompt-text" id="promptText"></div></div>
  <script>
    const vscode = acquireVsCodeApi(); let promptTimer;
    function postMessage(message) { vscode.postMessage(message); }
    function saveNote() { postMessage({action:'saveNote', note:document.getElementById('sessionNote').value}); }
    function toggleImportant(event, button, index) { event.stopPropagation(); const marked = button.classList.toggle('important'); button.textContent = marked ? '★' : '☆'; button.title = marked ? 'Marked important' : 'Mark as important'; postMessage({action:'important', index}); }
    function toggleDiff(index) { const row = document.getElementById('diff-' + index); row.hidden = !row.hidden; row.previousElementSibling.classList.toggle('is-open', !row.hidden); }
    function previewDetail(event, element) { clearTimeout(promptTimer); const popover = document.getElementById('promptPopover'); document.getElementById('detailTitle').textContent = element.dataset.title; document.getElementById('promptText').textContent = element.dataset.detail; popover.classList.add('visible'); popover.style.left = Math.min(event.clientX + 12, window.innerWidth - 370) + 'px'; popover.style.top = Math.min(event.clientY + 12, window.innerHeight - 260) + 'px'; }
    function hidePrompt() { promptTimer = setTimeout(closePrompt, 150); } function keepPromptOpen() { clearTimeout(promptTimer); } function closePrompt() { document.getElementById('promptPopover').classList.remove('visible'); } function pinDetail(event, element) { event.stopPropagation(); previewDetail(event, element); }
  </script>
</main></body></html>
